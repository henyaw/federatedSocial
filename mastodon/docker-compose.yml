# Mastodon — three services, three Tailscale sidecars (each gets its own
# tailnet identity for fine-grained ACL):
#
#   ts-mastodon-web        → Rails web (puma), public-facing via host nginx
#   ts-mastodon-streaming  → Node streaming server, public-facing via host nginx
#   ts-mastodon-sidekiq    → background jobs, internal-only
#
# All three reach the same shared Postgres + Redis via MagicDNS.
#
# Bring up shared-db/ first. Generate the secrets in .env.example before
# first boot — Mastodon refuses to start without SECRET_KEY_BASE etc.
#
# First-boot note: the web container runs `db:migrate` on every start (safe
# — Rails skips already-applied migrations). On the very first start it
# also runs `db:setup` if the database is empty.

name: federated-mastodon

# YAML anchor for the env vars every Mastodon container needs. Centralizes
# changes and avoids 60-line repetition across web/streaming/sidekiq.
x-mastodon-env: &mastodon-env
  RAILS_ENV: production
  NODE_ENV: production
  LOCAL_DOMAIN: ${MASTODON_DOMAIN}
  WEB_DOMAIN: ${MASTODON_DOMAIN}

  DB_HOST: ${DB_MAGIC_NAME}.${TS_TAILNET}
  DB_PORT: "5432"
  DB_NAME: ${MASTODON_DB_NAME}
  DB_USER: ${MASTODON_DB_USER}
  DB_PASS: ${MASTODON_DB_PASSWORD}

  REDIS_HOST: ${REDIS_MAGIC_NAME}.${TS_TAILNET}
  REDIS_PORT: "6379"

  SECRET_KEY_BASE: ${MASTODON_SECRET_KEY_BASE}
  OTP_SECRET: ${MASTODON_OTP_SECRET}
  VAPID_PRIVATE_KEY: ${MASTODON_VAPID_PRIVATE_KEY}
  VAPID_PUBLIC_KEY: ${MASTODON_VAPID_PUBLIC_KEY}

  ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${MASTODON_AR_ENC_DETERMINISTIC_KEY}
  ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${MASTODON_AR_ENC_KEY_DERIVATION_SALT}
  ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${MASTODON_AR_ENC_PRIMARY_KEY}

  SMTP_SERVER: ${MASTODON_SMTP_SERVER}
  SMTP_PORT: ${MASTODON_SMTP_PORT}
  SMTP_LOGIN: ${MASTODON_SMTP_LOGIN}
  SMTP_PASSWORD: ${MASTODON_SMTP_PASSWORD}
  SMTP_FROM_ADDRESS: ${MASTODON_SMTP_FROM_ADDRESS}
  SMTP_AUTH_METHOD: plain
  SMTP_OPENSSL_VERIFY_MODE: peer

services:

  # ---------------------------------------------------------------------
  # Web — Rails (Puma). Public-facing.
  # ---------------------------------------------------------------------

  ts-mastodon-web:
    image: tailscale/tailscale:latest
    hostname: ${MASTODON_WEB_MAGIC_NAME}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-${TS_OAUTH_CLIENT_SECRET}?ephemeral=true}
      TS_AUTHKEY: ${TS_OAUTH_CLIENT_SECRET}?ephemeral=true
      TS_EXTRA_ARGS: --advertise-tags=tag:mastodon-web
      TS_HOSTNAME: ${MASTODON_WEB_MAGIC_NAME}
      TS_ACCEPT_DNS: "true"
      TS_AUTH_ONCE: "true"
      TS_USERSPACE: "false"
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: "127.0.0.1:9002"
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9002/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  web:
    image: ghcr.io/mastodon/mastodon:latest
    network_mode: "service:ts-mastodon-web"
    # db:migrate is idempotent — Rails skips already-applied migrations.
    # db:setup is a no-op if schema exists; runs full setup on empty DB.
    command:
      - sh
      - -c
      - |
        bundle exec rails db:migrate &&
        exec bundle exec puma -C config/puma.rb
    environment:
      <<: *mastodon-env
    volumes:
      - mastodon-public-system:/mastodon/public/system
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health | grep -q OK"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    depends_on:
      ts-mastodon-web:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # Streaming — Node.js. Public-facing via host nginx (different upstream
  # path; usually proxied at /api/v1/streaming).
  # ---------------------------------------------------------------------

  ts-mastodon-streaming:
    image: tailscale/tailscale:latest
    hostname: ${MASTODON_STREAMING_MAGIC_NAME}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-${TS_OAUTH_CLIENT_SECRET}?ephemeral=true}
      TS_AUTHKEY: ${TS_OAUTH_CLIENT_SECRET}?ephemeral=true
      TS_EXTRA_ARGS: --advertise-tags=tag:mastodon-streaming
      TS_HOSTNAME: ${MASTODON_STREAMING_MAGIC_NAME}
      TS_ACCEPT_DNS: "true"
      TS_AUTH_ONCE: "true"
      TS_USERSPACE: "false"
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: "127.0.0.1:9002"
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9002/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  streaming:
    image: ghcr.io/mastodon/mastodon-streaming:latest
    network_mode: "service:ts-mastodon-streaming"
    environment:
      <<: *mastodon-env
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/v1/streaming/health | grep -q OK"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      ts-mastodon-streaming:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # Sidekiq — background workers. Internal-only.
  # ---------------------------------------------------------------------

  ts-mastodon-sidekiq:
    image: tailscale/tailscale:latest
    hostname: ${MASTODON_SIDEKIQ_MAGIC_NAME}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-${TS_OAUTH_CLIENT_SECRET}?ephemeral=true}
      TS_AUTHKEY: ${TS_OAUTH_CLIENT_SECRET}?ephemeral=true
      TS_EXTRA_ARGS: --advertise-tags=tag:mastodon-sidekiq
      TS_HOSTNAME: ${MASTODON_SIDEKIQ_MAGIC_NAME}
      TS_ACCEPT_DNS: "true"
      TS_AUTH_ONCE: "true"
      TS_USERSPACE: "false"
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: "127.0.0.1:9002"
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9002/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  sidekiq:
    image: ghcr.io/mastodon/mastodon:latest
    network_mode: "service:ts-mastodon-sidekiq"
    command: ["bundle", "exec", "sidekiq"]
    environment:
      <<: *mastodon-env
    volumes:
      - mastodon-public-system:/mastodon/public/system
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -q '[s]idekiq'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      ts-mastodon-sidekiq:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mastodon-public-system:
