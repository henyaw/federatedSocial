# Lemmy internal router.
#
# All containers (proxy, lemmy, lemmy-ui, pictrs) share the ts-lemmy-web
# network namespace, so upstreams are localhost. The reverse proxy on the
# host reaches this nginx on port 80.
#
# Routing rules match the Lemmy project's reference nginx config:
#   /api, /feeds, /nodeinfo, /.well-known, /version, /sitemap.xml
#     → lemmy backend (port 8536) — REST API + ActivityPub
#   /pictrs
#     → pictrs image service (port 8080)
#   / (everything else)
#     → lemmy-ui SSR frontend (port 1234)

worker_processes 1;
events {
  worker_connections 1024;
}

http {
  server {
    listen 80;
    server_name _;

    # 20 MB upload limit — raise if your instance allows large image uploads
    # (set the same limit in pictrs via PICTRS__SERVER__MAX_FILE_SIZE).
    client_max_body_size 20M;

    # Lemmy backend: API, ActivityPub, nodeinfo, feeds, sitemaps
    location ~ ^/(api|feeds|nodeinfo|\.well-known|version|sitemap\.xml) {
      proxy_pass http://localhost:8536;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Host $host;
    }

    # pict-rs image service
    location /pictrs {
      proxy_pass http://localhost:8080;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Host $host;
    }

    # lemmy-ui SSR frontend
    location / {
      proxy_pass http://localhost:1234;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Host $host;
    }
  }
}
