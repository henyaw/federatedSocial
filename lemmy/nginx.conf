# Lemmy internal router — mirrors the upstream Lemmy reference nginx config
# (https://github.com/LemmyNet/lemmy/blob/0.19.5/docker/nginx.conf), adapted
# to the shared-netns model: all containers share ts-lemmy-web's namespace, so
# the upstreams are localhost. The host reverse proxy reaches this nginx on
# port 80.
#
# Routing (DO NOT simplify — the content negotiation at / is load-bearing for
# federation):
#   /            → lemmy-ui (1234) for browsers, BUT ActivityPub requests
#                  (Accept: application/(activity|ld)+json) and all POSTs go to
#                  the lemmy backend (8536). Remote instances fetch actors
#                  (/u/*, /c/*, /post/*) with that Accept header and deliver to
#                  inboxes via POST — routing those to the UI breaks federation.
#   /api, /pictrs, /feeds, /nodeinfo, /version, /.well-known → lemmy backend.
#                  Note /pictrs goes to the BACKEND, which proxies to pict-rs
#                  internally — NOT directly to pict-rs:8080.

worker_processes 1;
events {
  worker_connections 1024;
}

http {
  upstream lemmy {
    server 127.0.0.1:8536;
  }
  upstream lemmy-ui {
    server 127.0.0.1:1234;
  }

  server {
    listen 80;
    server_name _;

    # 20 MB upload limit — matches the upstream Lemmy nginx default and the
    # host Caddy block (caddy/Caddyfile). Raise all three together (here,
    # Caddyfile, and pict-rs PICTRS__MEDIA__MAX_FILE_SIZE) for larger uploads.
    client_max_body_size 20M;

    # Browsers get the SSR UI; ActivityPub fetches and federation POSTs get
    # the backend. This split is required for federation to work.
    location / {
      set $proxpass "http://lemmy-ui";
      if ($http_accept = "application/activity+json") {
        set $proxpass "http://lemmy";
      }
      if ($http_accept = "application/ld+json; profile=\"https://www.w3.org/ns/activitystreams\"") {
        set $proxpass "http://lemmy";
      }
      if ($request_method = POST) {
        set $proxpass "http://lemmy";
      }
      proxy_pass $proxpass;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Host $host;
    }

    # Backend: REST API, ActivityPub, image proxy, feeds, nodeinfo, discovery.
    # /pictrs is handled by the backend (which proxies to pict-rs) — do not
    # point this at pict-rs:8080 directly.
    location ~ ^/(api|pictrs|feeds|nodeinfo|version|\.well-known) {
      proxy_pass "http://lemmy";

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Host $host;
    }
  }
}
