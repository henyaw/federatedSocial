# Lemmy — federated link aggregator / community discussion board.
#
# Four containers share the ts-lemmy-web network namespace:
#   proxy     — nginx that routes public traffic to lemmy, lemmy-ui, and pictrs
#   lemmy     — Rust backend API (port 8536)
#   lemmy-ui  — SSR frontend (port 1234)
#   pictrs    — image hosting service (port 8080)
#
# All internal traffic stays on localhost (shared netns). The reverse proxy
# reaches the stack on port 80 (the nginx aggregator). Lemmy has no Redis
# dependency — Postgres only.
#
# FIRST BOOT:
#   1. ./bootstrap.sh provision-db lemmy   # creates user/db in postgres
#   2. ./bootstrap.sh up lemmy             # generates lemmy.runtime.hjson, brings up stack
#   3. First visit to the public URL prompts you to create the admin account.
#
# Pin LEMMY_VERSION in .env — backend (dessalines/lemmy) and UI
# (dessalines/lemmy-ui) must be the SAME tag or the API breaks.

name: federated-lemmy

services:

  ts-lemmy-web:
    image: tailscale/tailscale:latest
    hostname: ${LEMMY_MAGIC_NAME}
    environment:
      TS_AUTHKEY: ${TS_OAUTH_CLIENT_SECRET}?ephemeral=true
      TS_EXTRA_ARGS: --advertise-tags=tag:lemmy-web
      TS_HOSTNAME: ${LEMMY_MAGIC_NAME}
      TS_ACCEPT_DNS: "true"
      TS_AUTH_ONCE: "true"
      TS_USERSPACE: "false"
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: "127.0.0.1:9002"
    dns: [1.1.1.1, 1.0.0.1]
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    healthcheck:
      # Lemmy has no Redis dependency — gate on Postgres only.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9002/healthz && nc -z -w3 ${DB_MAGIC_NAME}.${TS_TAILNET} 5432"]
      interval: 10s
      timeout: 15s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  proxy:
    # nginx aggregator — routes /, /api, /pictrs, /feeds, etc. to the
    # correct backend on localhost. The reverse proxy on the host reaches
    # this container on port 80. See nginx.conf for routing details.
    image: nginx:alpine
    network_mode: "service:ts-lemmy-web"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      ts-lemmy-web:
        condition: service_healthy
    restart: unless-stopped

  lemmy:
    # Pin LEMMY_VERSION in .env — must match lemmy-ui exactly.
    image: dessalines/lemmy:${LEMMY_VERSION:-0.19.5}
    network_mode: "service:ts-lemmy-web"
    environment:
      RUST_LOG: warn
    volumes:
      # Generated by `./bootstrap.sh up lemmy` from lemmy.hjson template.
      # Gitignored — edit lemmy.hjson (the tracked template), not this file.
      - ./lemmy.runtime.hjson:/config/config.hjson:ro
    depends_on:
      ts-lemmy-web:
        condition: service_healthy
    restart: unless-stopped

  lemmy-ui:
    # Must match LEMMY_VERSION above exactly.
    image: dessalines/lemmy-ui:${LEMMY_VERSION:-0.19.5}
    network_mode: "service:ts-lemmy-web"
    environment:
      # All containers share ts-lemmy-web's netns, so lemmy backend is on
      # localhost:8536. The external host is used for SSR metadata generation.
      LEMMY_UI_LEMMY_INTERNAL_HOST: "localhost:8536"
      LEMMY_UI_LEMMY_EXTERNAL_HOST: "https://${LEMMY_DOMAIN}"
      LEMMY_UI_HTTPS: "true"
    depends_on:
      ts-lemmy-web:
        condition: service_healthy
    restart: unless-stopped

  pictrs:
    # pict-rs: image hosting service. Lemmy proxies /pictrs/* requests here.
    # PICTRS__SERVER__API_KEY must match pictrs.api_key in lemmy.runtime.hjson.
    image: asonix/pictrs:0.5
    network_mode: "service:ts-lemmy-web"
    environment:
      PICTRS__SERVER__API_KEY: ${LEMMY_PICTRS_API_KEY}
    volumes:
      - pictrs-data:/mnt/sled-repo
      - pictrs-export:/mnt/export
    depends_on:
      ts-lemmy-web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pictrs-data:
  pictrs-export:
