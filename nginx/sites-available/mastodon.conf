# Reference Mastodon reverse-proxy snippet for the host nginx.
#
# Mastodon has two upstream services: the Rails web (port 3000) and the
# Node streaming server (port 4000). Both must be proxied from the same
# public hostname; the streaming endpoint is mounted at /api/v1/streaming.
#
# Replace mastodon.example.com and adjust cert paths.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream mastodon_web {
    server mastodon.tailfe8c.ts.net:3000 fail_timeout=0;
}

upstream mastodon_streaming {
    server mastodon-streaming.tailfe8c.ts.net:4000 fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name mastodon.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mastodon.example.com;

    ssl_certificate     /etc/letsencrypt/live/mastodon.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mastodon.example.com/privkey.pem;

    # Media uploads — bump if you raise MAX_FILE_SIZE in Mastodon.
    client_max_body_size 80M;

    # Common proxy headers.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Proxy             "";

    proxy_http_version 1.1;

    # Streaming — websockets, route by path prefix.
    location /api/v1/streaming {
        proxy_pass http://mastodon_streaming;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_buffering off;
        proxy_redirect  off;
        tcp_nodelay     on;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Everything else → Rails.
    location / {
        proxy_pass http://mastodon_web;

        proxy_redirect off;

        proxy_connect_timeout 30s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
    }
}
