# Reference Pixelfed reverse-proxy snippet for the host nginx.
#
# Place at /etc/nginx/sites-available/pixelfed.conf and symlink into
# sites-enabled. TLS termination happens here; the upstream is the
# Pixelfed web sidecar reachable via MagicDNS over the tailnet.
#
# Replace pixelfed.example.com and adjust the cert paths to match your
# certbot/Let's Encrypt setup, then `nginx -t && systemctl reload nginx`.

# WebSocket upgrade plumbing. Unlike Caddy, nginx only forwards the
# Upgrade/Connection headers if told to. This map belongs in the http{}
# context — sites-enabled snippets are included there — and is consumed by
# the proxy_set_header lines below.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name pixelfed.example.com;

    # Redirect all HTTP to HTTPS.
    return 301 https://$host$request_uri;
}

server {
    # NOTE: the `http2` listen parameter is correct for Debian's nginx (1.22).
    # On nginx >= 1.25.1 it warns; switch to a separate `http2 on;` there.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pixelfed.example.com;

    ssl_certificate     /etc/letsencrypt/live/pixelfed.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pixelfed.example.com/privkey.pem;

    # Modern TLS (protocols/ciphers/session cache), managed by certbot. If you
    # don't use certbot, delete these two lines and set your own ssl_protocols
    # / ssl_ciphers (Mozilla "intermediate" is a sane baseline).
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Keep browsers on HTTPS. Add includeSubDomains only if every subdomain on
    # this apex is HTTPS-only. `always` so it is sent on error responses too.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Pixelfed uploads one file per request; default per-file MAX_PHOTO_SIZE is
    # ~15 MB. 32M leaves headroom for video/avatars. Raise this together with
    # MAX_PHOTO_SIZE / post_max_size / upload_max_filesize if you bump them.
    client_max_body_size 32M;

    # Compress text responses, including ActivityPub / JSON-LD federation
    # payloads. Already-compressed media is passed through untouched.
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        text/plain text/css text/xml
        application/json application/javascript application/xml
        application/activity+json application/ld+json
        image/svg+xml;

    # Stream uploads and media straight through instead of buffering large
    # bodies to nginx temp files.
    proxy_request_buffering off;
    proxy_buffering off;

    # Resolve the upstream via Tailscale MagicDNS (100.100.100.100) at runtime.
    # This is the important bit: the Pixelfed sidecar is ephemeral and gets a
    # NEW tailnet IP on every restart. A literal hostname in proxy_pass would be
    # resolved once at config load and cached for the worker's lifetime, so a
    # `docker compose up` of the Pixelfed stack would leave nginx proxying to a
    # dead IP (502s) until reloaded. Using a variable + resolver re-resolves on
    # the TTL and tracks the IP automatically.
    resolver 100.100.100.100 valid=30s ipv6=off;

    location / {
        set $pixelfed_upstream pixelfed.tailfe8c.ts.net;
        # The MagicDNS hostname matches PIXELFED_WEB_MAGIC_NAME in your
        # repo-root .env. Port 80 is what the pixelfed-glitch nginx listens on
        # inside the sidecar netns.
        proxy_pass http://$pixelfed_upstream:80;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # WebSocket upgrade (see the map at the top of this file).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 30s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
    }
}

# ---- Public media host — ONLY when PIXELFED_ENABLE_CLOUD=true --------------
#
# With S3/Garage storage on, Pixelfed embeds object URLs that browsers fetch
# directly, so they need a public host. This MUST proxy Garage's WEB endpoint
# (:3902) and rewrite Host to the bucket vhost — NOT the S3 API (:3900, which
# is signed-only and 403s anonymous GETs). Why 3902-not-3900 and how Host
# routing works: see "Serving media to the public" in the repo README.
#
# Uncomment, replace pixelfed-media.example.com + cert paths + the Garage
# MagicDNS host, then in .env set:
#   PIXELFED_S3_URL=https://pixelfed-media.example.com
#
