# Reference Pixelfed reverse-proxy snippet for the host nginx.
#
# Place at /etc/nginx/sites-available/pixelfed.conf and symlink into
# sites-enabled. TLS termination happens here; the upstream is the
# Pixelfed web sidecar reachable via MagicDNS over the tailnet.
#
# Replace pixelfed.example.com and adjust the cert paths to match your
# certbot/Let's Encrypt setup.

server {
    listen 80;
    listen [::]:80;
    server_name pixelfed.example.com;

    # Redirect all HTTP to HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pixelfed.example.com;

    ssl_certificate     /etc/letsencrypt/live/pixelfed.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pixelfed.example.com/privkey.pem;

    # Pixelfed allows up to 15 MB image uploads by default. Raise if you
    # bumped post_max_size / upload_max_filesize in your overrides.
    client_max_body_size 16M;

    # Buffer tuning for large media responses.
    proxy_buffering off;
    proxy_request_buffering off;

    location / {
        # The MagicDNS hostname matches PIXELFED_WEB_MAGIC_NAME in your
        # repo-root .env. Port 80 is what the pixelfed-glitch nginx
        # listens on inside the sidecar netns.
        proxy_pass http://pixelfed.tailfe8c.ts.net:80;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 30s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
    }
}
