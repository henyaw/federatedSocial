# Reference GoToSocial reverse-proxy snippet for the host nginx.
#
# Place at /etc/nginx/sites-available/gotosocial.conf and symlink into
# sites-enabled. TLS termination happens here; the upstream is the
# GoToSocial container reachable via MagicDNS over the tailnet.
#
# Replace gotosocial.example.com and adjust the cert paths to match your
# certbot/Let's Encrypt setup. Also replace the MagicDNS hostname with
# GOTOSOCIAL_WEB_MAGIC_NAME.TS_TAILNET from your repo-root .env.

server {
    listen 80;
    listen [::]:80;
    server_name gotosocial.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gotosocial.example.com;

    ssl_certificate     /etc/letsencrypt/live/gotosocial.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gotosocial.example.com/privkey.pem;

    # GoToSocial accepts media uploads up to 40 MiB by default
    # (media-local-max-size in config.yaml). Adjust here if you raise it.
    client_max_body_size 40M;

    # WebSockets for the streaming API.
    proxy_http_version 1.1;

    location / {
        # The MagicDNS hostname matches GOTOSOCIAL_WEB_MAGIC_NAME.TS_TAILNET
        # from your repo-root .env. Port 8080 is GoToSocial's internal listener.
        proxy_pass http://YOUR-GOTOSOCIAL-WEB-MAGIC-NAME.YOUR-TS-TAILNET:8080;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Connection        $http_connection;
        proxy_set_header Upgrade           $http_upgrade;

        proxy_buffering off;

        proxy_connect_timeout 30s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
    }
}

# ---- Public media host — ONLY when GOTOSOCIAL_STORAGE_BACKEND=s3 -----------
