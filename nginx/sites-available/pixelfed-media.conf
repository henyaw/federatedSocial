# Reference Pixelfed *media* reverse-proxy snippet for the host nginx.
#
# ONLY needed when Pixelfed stores uploads in an S3-compatible object store
# (PF_ENABLE_CLOUD=true) such as Garage. Pixelfed builds media URLs from its
# AWS_URL, so point the operator knob at this public host in .env:
#
#   PIXELFED_S3_URL=https://pixelfed-media.example.com
#
# (PIXELFED_S3_URL becomes the app's AWS_URL. The app itself reaches Garage's
# S3 API on :3900 via AWS_ENDPOINT; this host fronts Garage's *web* endpoint
# on :3902 for public reads.) This block forwards to the web endpoint and
# rewrites the Host header to the bucket's vhost so the store serves the right
# bucket. It is the nginx translation of this Caddy block:
#
#   pixelfed-media.example.com {
#     reverse_proxy http://garage.tailfe8c.ts.net:3902 {
#       header_up Host pixelfed-media.web.garage.local
#     }
#   }
#
# Replace pixelfed-media.example.com, the Garage MagicDNS host, and the bucket
# vhost (pixelfed-media.web.garage.local — that is <bucket>.<garage web
# root_domain>) to match your setup. `nginx -t` before reload.

server {
    listen 80;
    listen [::]:80;
    server_name pixelfed-media.example.com;

    # Redirect all HTTP to HTTPS.
    return 301 https://$host$request_uri;
}

server {
    # `http2` listen param is correct for Debian's nginx (1.22); on >= 1.25.1
    # use a separate `http2 on;` instead.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pixelfed-media.example.com;

    ssl_certificate     /etc/letsencrypt/live/pixelfed-media.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pixelfed-media.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # GET-only public media; uploads go app -> Garage over the tailnet, not
    # through this host, so no large client_max_body_size is needed. Stream
    # large objects rather than buffering them to nginx temp files.
    proxy_buffering off;

    # Re-resolve the Garage sidecar via Tailscale MagicDNS so an ephemeral IP
    # change doesn't strand nginx on a dead address (same rationale as the app
    # snippet). 100.100.100.100 is the Tailscale MagicDNS resolver.
    resolver 100.100.100.100 valid=30s ipv6=off;

    location / {
        set $garage_upstream garage.tailfe8c.ts.net;
        proxy_pass http://$garage_upstream:3902;

        proxy_http_version 1.1;

        # The critical line, equivalent to Caddy's `header_up Host ...`:
        # object stores route by Host, so send the BUCKET vhost rather than the
        # public $host. Without this you get the wrong bucket (or a 404).
        proxy_set_header Host pixelfed-media.web.garage.local;

        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;

        # Optional: front Garage with an nginx media cache to cut load and
        # latency. Requires a `proxy_cache_path ... keys_zone=media:...;` in the
        # http{} context, then uncomment:
        #   proxy_cache media;
        #   proxy_cache_valid 200 30d;
        #   add_header X-Cache-Status $upstream_cache_status;
    }
}
