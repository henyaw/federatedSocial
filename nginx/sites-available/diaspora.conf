# Reference Diaspora reverse-proxy snippet for the host nginx.
#
# Diaspora's Rails app listens on port 3000 inside the diaspora sidecar
# netns. The koehn/diaspora image also runs lighttpd on 8080 to serve
# precompiled assets, but proxying everything to 3000 works fine for
# small/medium pods (Rails serves assets too).
#
# Replace diaspora.example.com and adjust cert paths.

upstream diaspora_app {
    server diaspora.tailfe8c.ts.net:3000 fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name diaspora.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name diaspora.example.com;

    ssl_certificate     /etc/letsencrypt/live/diaspora.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/diaspora.example.com/privkey.pem;

    # Diaspora image uploads — adjust to taste.
    client_max_body_size 16M;

    location / {
        proxy_pass http://diaspora_app;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
    }
}
