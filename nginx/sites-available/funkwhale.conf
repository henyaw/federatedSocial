# Reference Funkwhale reverse-proxy snippet for the host nginx.
#
# Place at /etc/nginx/sites-available/funkwhale.conf and symlink into
# sites-enabled. TLS termination happens here; the upstream is the
# Funkwhale front sidecar reachable via MagicDNS over the tailnet.
#
# Replace funkwhale.example.com and adjust the cert paths to match your
# certbot/Let's Encrypt setup.
#
# Funkwhale requires several non-standard proxy paths for federation
# (/.well-known/), the streaming API (/api/v1/ws), and protected media
# (the front nginx handles X-Accel-Redirect internally, so the host
# nginx just needs to pass /media/ through without buffering).

server {
    listen 80;
    listen [::]:80;
    server_name funkwhale.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name funkwhale.example.com;

    ssl_certificate     /etc/letsencrypt/live/funkwhale.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/funkwhale.example.com/privkey.pem;

    # Funkwhale allows audio uploads up to 100 MB by default (NGINX_MAX_BODY_SIZE).
    # Raise both here and in the compose env if you increase that limit.
    client_max_body_size 100M;

    # Required for the WebSocket streaming endpoint.
    proxy_http_version 1.1;

    location / {
        # The MagicDNS hostname matches FUNKWHALE_WEB_MAGIC_NAME.TS_TAILNET
        # from your repo-root .env. Port 80 is the front nginx inside the
        # sidecar netns.
        proxy_pass http://YOUR-FUNKWHALE-WEB-MAGIC-NAME.YOUR-TS-TAILNET:80;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Required for ActivityPub federation keep-alive and SSE.
        proxy_set_header Connection        $http_connection;
        proxy_set_header Upgrade           $http_upgrade;

        proxy_buffering off;
        proxy_request_buffering off;

        proxy_connect_timeout 30s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
    }
}
