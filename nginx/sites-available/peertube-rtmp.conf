# Reference nginx stream-module snippet for proxying public RTMP ingest
# to the PeerTube container over the tailnet.
#
# OPTIONAL. Skip this entirely if streamers will publish from devices that
# are on your tailnet — in that case they hit
# rtmp://YOUR-PEERTUBE-WEB-MAGIC-NAME.YOUR-TS-TAILNET:1935 directly and no
# public exposure is needed (more secure, simpler).
#
# Requirements:
#   - nginx built with --with-stream (Debian/Ubuntu: apt-get install
#     libnginx-mod-stream).
#   - The host machine has tag:reverse-proxy applied in the Tailscale
#     admin console (so the existing ACL grant for tag:peertube-web:1935
#     applies).
#
# Place outside the http {} block (e.g. directly in nginx.conf, or in
# /etc/nginx/streams-enabled/peertube-rtmp.conf if your distro splits
# streams from http). RTMP is plaintext TCP — there is no TLS here. If
# you want RTMPS for the public side, use a TLS-terminating proxy in
# front (nginx stream can do this with `ssl on;` plus a cert).

stream {
    upstream peertube_rtmp {
        # MagicDNS hostname matches PEERTUBE_WEB_MAGIC_NAME.TS_TAILNET
        # from your repo-root .env.
        server YOUR-PEERTUBE-WEB-MAGIC-NAME.YOUR-TS-TAILNET:1935;
    }

    server {
        listen 1935;
        listen [::]:1935;

        proxy_pass         peertube_rtmp;
        proxy_timeout      1h;
        proxy_connect_timeout 10s;
    }
}
