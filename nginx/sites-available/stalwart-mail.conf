# Reference nginx stream-module snippet — public mail edge for Stalwart.
#
# ############################################################################
# # UNTESTED. This is the nginx equivalent of the Caddy L4 edge in           #
# # stalwart/caddy/ (caddy.json), translated feature-for-feature but not yet #
# # exercised against a live Stalwart instance. The Caddy edge is the        #
# # known-good path. Use this only if you'd rather not run a second Caddy and #
# # already operate nginx on the box — and verify mail flow end-to-end       #
# # before trusting it.                                                       #
# ############################################################################
#
# What this does (same job as the Caddy L4 edge):
#   - Pipes the public mail ports (25/465/587/143/993) straight through to the
#     Stalwart sidecar over the tailnet. Pure TCP pass-through — Stalwart
#     terminates ALL TLS itself. nginx never sees the plaintext.
#   - Preserves the real client IP via PROXY protocol (see the v1/v2 note
#     below) on the mail ports only.
#   - Fans out the public :443 by SNI (without terminating TLS) so Stalwart's
#     MTA-STS / autoconfig / autodiscover hostnames reach Stalwart while every
#     other SNI falls through to your web reverse proxy on :8443.
#
# Why the stream module (not a normal server block): mail can't be reverse-
# proxied at layer 7. Port 25 has no SNI (STARTTLS happens after connect) and
# needs one global listener. So the edge is a dumb L4 pipe. This is exactly
# what nginx's `stream {}` context is for — the same module the PeerTube RTMP
# snippet uses (nginx/sites-available/peertube-rtmp.conf).
#
# ---------------------------------------------------------------------------
# Requirements
# ---------------------------------------------------------------------------
#   - nginx built with --with-stream and --with-stream_ssl_preread_module.
#     Debian/Ubuntu: apt-get install libnginx-mod-stream
#     (ssl_preread has shipped in mainline since 1.11.5 — any current nginx).
#   - This host on the tailnet and tagged tag:reverse-proxy, so the ACL grant
#     tag:reverse-proxy -> tag:stalwart on the mail ports (+ tcp:443) applies.
#     See ../../acl.example.hujson.
#   - Public firewall opens 25, 465, 587, 143, 993 (and 443 if using the SNI
#     fan-out below). Nothing else bound to those ports on the host.
#
# ---------------------------------------------------------------------------
# Placement — IMPORTANT
# ---------------------------------------------------------------------------
# `stream {}` is a TOP-LEVEL context, a sibling of `http {}`. It CANNOT live in
# sites-available/, which the Debian nginx package includes only into the
# `http {}` block. Put this either:
#   - directly in /etc/nginx/nginx.conf (outside http {}), or
#   - in /etc/nginx/streams-enabled/stalwart-mail.conf if your distro splits
#     stream configs out (and the main nginx.conf has a matching include).
# The "sites-available" filename here is for catalogue consistency with the
# other reference snippets; it does not mean "symlink into sites-enabled".
#
# ---------------------------------------------------------------------------
# PROXY protocol: nginx sends v1, the Caddy edge sends v2
# ---------------------------------------------------------------------------
# nginx's `proxy_protocol on;` emits the v1 (human-readable text) header;
# Caddy emits v2 (binary). Stalwart's PROXY receiver auto-detects the version,
# so either works. The trusted-source config inside Stalwart is identical:
# enable PROXY on the mail listeners and trust 100.64.0.0/10 (the Tailscale
# CGNAT range) — NOT on the :443/admin paths. See the README "Stalwart:
# first-boot configuration" section.
#
# ---------------------------------------------------------------------------
# Before deploying: replace the two placeholders everywhere below
#   YOUR-STALWART-MAGIC-NAME.YOUR-TS-TAILNET  -> STALWART_MAGIC_NAME.TS_TAILNET
#   stalwart.example.com                      -> your STALWART_DOMAIN
# ---------------------------------------------------------------------------

stream {
    # MagicDNS hostname of the Stalwart sidecar (STALWART_MAGIC_NAME.TS_TAILNET
    # from your repo-root .env). Stable across restarts; the tailnet IP is not.
    upstream stalwart_smtp        { server YOUR-STALWART-MAGIC-NAME.YOUR-TS-TAILNET:25; }
    upstream stalwart_submissions { server YOUR-STALWART-MAGIC-NAME.YOUR-TS-TAILNET:465; }
    upstream stalwart_submission  { server YOUR-STALWART-MAGIC-NAME.YOUR-TS-TAILNET:587; }
    upstream stalwart_imap        { server YOUR-STALWART-MAGIC-NAME.YOUR-TS-TAILNET:143; }
    upstream stalwart_imaps       { server YOUR-STALWART-MAGIC-NAME.YOUR-TS-TAILNET:993; }

    # ---- Mail ports: raw TCP pass-through, PROXY protocol to upstream ----
    # Stalwart terminates TLS (implicit on 465/993, STARTTLS on 25/587/143).
    # proxy_protocol on; prepends the v1 header so Stalwart sees the real IP.

    server {                                   # SMTP (inbound MX + MSA STARTTLS)
        listen 25;
        listen [::]:25;
        proxy_pass         stalwart_smtp;
        proxy_protocol     on;
        proxy_timeout      300s;
        proxy_connect_timeout 10s;
    }

    server {                                   # Submissions (implicit TLS)
        listen 465;
        listen [::]:465;
        proxy_pass         stalwart_submissions;
        proxy_protocol     on;
        proxy_timeout      300s;
        proxy_connect_timeout 10s;
    }

    server {                                   # Submission (STARTTLS)
        listen 587;
        listen [::]:587;
        proxy_pass         stalwart_submission;
        proxy_protocol     on;
        proxy_timeout      300s;
        proxy_connect_timeout 10s;
    }

    server {                                   # IMAP (STARTTLS)
        listen 143;
        listen [::]:143;
        proxy_pass         stalwart_imap;
        proxy_protocol     on;
        proxy_timeout      1h;                 # IMAP IDLE holds the connection open
        proxy_connect_timeout 10s;
    }

    server {                                   # IMAPS (implicit TLS)
        listen 993;
        listen [::]:993;
        proxy_pass         stalwart_imaps;
        proxy_protocol     on;
        proxy_timeout      1h;                 # IMAP IDLE holds the connection open
        proxy_connect_timeout 10s;
    }

    # ---- :443 SNI fan-out (OPTIONAL) ----------------------------------------
    # Stalwart publishes mta-sts/autoconfig/autodiscover hostnames pointing at
    # this box's public IP, served over :443. ssl_preread reads the SNI WITHOUT
    # terminating TLS, so we can route those three names to Stalwart (which
    # terminates with its own cert — NO proxy_protocol on :443) and send every
    # other name to your web reverse proxy.
    #
    # If THIS nginx also serves your normal web vhosts, it cannot listen on both
    # :443 (here, in stream) and :443 (in http {} for your sites). Move your
    # http {} HTTPS vhosts to listen on 8443 and let this block fan out to them
    # at 127.0.0.1:8443. (The Caddy edge documents the mirror-image move:
    # https_port 8443 in the L7 Caddy.) A mail-ONLY box with no other web
    # vhosts can delete this entire block and the maps/upstreams it references.

    map $ssl_preread_server_name $stalwart_https_upstream {
        mta-sts.stalwart.example.com       stalwart_https;
        autoconfig.stalwart.example.com    stalwart_https;
        autodiscover.stalwart.example.com  stalwart_https;
        default                            local_web;
    }

    upstream stalwart_https { server YOUR-STALWART-MAGIC-NAME.YOUR-TS-TAILNET:443; }
    upstream local_web      { server 127.0.0.1:8443; }

    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;                        # inspect SNI, do NOT terminate TLS
        proxy_pass  $stalwart_https_upstream;
        proxy_connect_timeout 10s;
    }
}
