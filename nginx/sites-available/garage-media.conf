# Reference snippet for serving Garage object storage as public HTTPS media.
#
# Garage runs inside a Tailscale sidecar — its ports are only reachable inside
# the tailnet, so public browsers cannot fetch objects directly.
#
# IMPORTANT: do NOT proxy to Garage's S3 API port (3900). That port requires
# every request to be signed and returns 403 "does not support anonymous
# access" for unauthenticated GETs. Public media is served by Garage's *web
# endpoint* (port 3902, [s3_web] in garage.toml) for buckets that have website
# serving enabled — bootstrap.sh provision-garage does this automatically.
#
# How bucket selection works on the web endpoint:
#   The bucket is chosen from the Host header. A request with
#   Host: <bucket>.web.garage.local  is served from <bucket>, and the URL path
#   is the object key directly (no bucket prefix). So this proxy must REWRITE
#   the Host header to the bucket's web-domain form — it must NOT rewrite the
#   path. (This matches the keys apps generate, e.g. /public/m/<hash>/file.jpg.)
#
# Placeholders to replace:
#   media.example.com   → your chosen media hostname (add a public DNS record)
#   tailfe8c.ts.net     → your TS_TAILNET value from .env
#   garage              → GARAGE_MAGIC_NAME from .env  (default: "garage")
#
# After deploying this, set the matching var in .env and restart the app:
#   PIXELFED_S3_URL=https://media.example.com   →  ./bootstrap.sh up pixelfed
#   MASTODON_S3_ALIAS_HOST=mastodon-media.example.com (host only, no scheme)

# ---- Pixelfed media -------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name media.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name media.example.com;

    ssl_certificate     /etc/letsencrypt/live/media.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/media.example.com/privkey.pem;

    location / {
        # Web endpoint (3902), NOT the S3 API (3900). The Host header selects
        # the bucket via root_domain matching (.web.garage.local in garage.toml).
        proxy_pass http://garage.tailfe8c.ts.net:3902;
        proxy_set_header Host       pixelfed-media.web.garage.local;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Strip S3 noise from public responses.
        proxy_hide_header x-amz-id-2;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header Set-Cookie;

        # CORS — required when app JavaScript fetches media directly
        # (avatar loads, image dimension checks, etc.).
        add_header Access-Control-Allow-Origin  "*"                  always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Max-Age       86400                always;

        # Answer OPTIONS preflight without forwarding to Garage.
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin  "*";
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
            add_header Access-Control-Max-Age       86400;
            return 204;
        }

        # Media objects are content-addressed and never mutated — cache hard.
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
    }
}

