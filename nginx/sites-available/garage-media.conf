# Reference snippet for proxying Garage S3 media to public HTTPS.
#
# Garage runs inside a Tailscale sidecar — its S3 port (3900) is only reachable
# inside the tailnet, so objects cannot be fetched by public browsers directly.
# This nginx block gives each media bucket a public HTTPS endpoint.
#
# Deploy one server block per app bucket. Placeholders to replace:
#   media.example.com   → your chosen media hostname (add DNS A record)
#   tailfe8c.ts.net     → your TS_TAILNET value from .env
#   garage              → GARAGE_MAGIC_NAME from .env  (default: "garage")
#
# After deploying this, set the matching var in .env and restart the app:
#   PIXELFED_S3_URL=https://media.example.com
#   → ./bootstrap.sh up pixelfed
#
# For Mastodon, uncomment the second server block below and set:
#   MASTODON_S3_ALIAS_HOST=mastodon-media.example.com   (hostname only, no scheme)
#   → ./bootstrap.sh up mastodon
#
# Why proxy instead of exposing Garage directly?
# Garage's sidecar binds only to tailscale0 — there is no host port to open.
# The host nginx reaches it via MagicDNS because the host already runs Tailscale.

# ---- Pixelfed media -------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name media.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name media.example.com;

    ssl_certificate     /etc/letsencrypt/live/media.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/media.example.com/privkey.pem;

    # Pixelfed stores objects with keys like: public/m/<hash>/original.jpg
    # Garage path-style URL:  http://garage.tailnet:3900/pixelfed-media/<key>
    # With AWS_URL=https://media.example.com, Pixelfed generates:
    #   https://media.example.com/<key>
    # so nginx must prepend the bucket name before forwarding to Garage.
    location / {
        proxy_pass http://garage.tailfe8c.ts.net:3900/pixelfed-media/;

        proxy_http_version 1.1;
        proxy_set_header Host       garage.tailfe8c.ts.net;
        proxy_set_header Connection "";

        # Strip S3 noise from public responses.
        proxy_hide_header x-amz-id-2;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-meta-server-side-encryption;
        proxy_hide_header x-amz-server-side-encryption;
        proxy_hide_header Set-Cookie;

        # CORS — required when Pixelfed JavaScript fetches media directly
        # (avatar loads, image dimension checks, etc.).
        add_header Access-Control-Allow-Origin  "*"                  always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Max-Age       86400                always;

        # Answer OPTIONS preflight without forwarding to Garage.
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin  "*";
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
            add_header Access-Control-Max-Age       86400;
            return 204;
        }

        # Media objects are content-addressed and never mutated — cache hard.
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
    }
}

