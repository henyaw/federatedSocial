# ============================================================================
# Caddy equivalent (the user is running Caddy, not nginx). Same logic:
# rewrite the Host header to the bucket's web-domain, proxy to port 3902,
# never touch the path.
#
#   media.example.com {
#       reverse_proxy http://garage.tailfe8c.ts.net:3902 {
#           header_up Host pixelfed-media.web.garage.local
#       }
#       header {
#           Access-Control-Allow-Origin  "*"
#           Access-Control-Allow-Methods "GET, HEAD, OPTIONS"
#           Cache-Control "public, max-age=31536000, immutable"
#           -x-amz-id-2
#           -x-amz-request-id
#       }
#   }
#
# Caddy auto-provisions TLS for media.example.com via ACME — no cert paths
# needed. Ensure the public DNS A record points at the Caddy host.
# ============================================================================
