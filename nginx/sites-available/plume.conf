# Reference Plume reverse-proxy snippet for the host nginx.
#
# Plume listens on port 7878 inside the plume sidecar netns. The Rust
# binary handles federation, web UI, and assets directly — no separate
# streaming or worker tier, so the proxy config is the simplest in the
# repo.
#
# Replace plume.example.com and adjust cert paths.

upstream plume_app {
    server plume.tailfe8c.ts.net:7878 fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name plume.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name plume.example.com;

    ssl_certificate     /etc/letsencrypt/live/plume.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plume.example.com/privkey.pem;

    # Article attachments and avatars.
    client_max_body_size 16M;

    location / {
        proxy_pass http://plume_app;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
    }
}
