# Reference PeerTube reverse-proxy snippet for the host nginx (HTTP/HTTPS).
#
# Place at /etc/nginx/sites-available/peertube.conf and symlink into
# sites-enabled. TLS termination happens here; the upstream is the
# PeerTube container reachable via MagicDNS over the tailnet.
#
# Replace peertube.example.com and adjust the cert paths to match your
# certbot/Let's Encrypt setup. Also replace the MagicDNS hostname with
# PEERTUBE_WEB_MAGIC_NAME.TS_TAILNET from your repo-root .env.
#
# RTMP live ingest is a separate concern — see peertube-rtmp.conf in
# this directory for the nginx stream module reference.

server {
    listen 80;
    listen [::]:80;
    server_name peertube.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name peertube.example.com;

    ssl_certificate     /etc/letsencrypt/live/peertube.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/peertube.example.com/privkey.pem;

    # PeerTube uploads can be very large. Set this to a comfortable ceiling
    # for your instance (server-side video files, not import URLs).
    client_max_body_size 8G;
    client_body_timeout  600s;

    # Required for WebSockets (federation, live chat, admin notifications).
    proxy_http_version 1.1;

    location / {
        # The MagicDNS hostname matches PEERTUBE_WEB_MAGIC_NAME.TS_TAILNET
        # from your repo-root .env. Port 9000 is PeerTube's internal listener.
        proxy_pass http://YOUR-PEERTUBE-WEB-MAGIC-NAME.YOUR-TS-TAILNET:9000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Connection        $http_connection;
        proxy_set_header Upgrade           $http_upgrade;

        # Disable buffering so progressive video streams flush promptly.
        proxy_buffering         off;
        proxy_request_buffering off;

        proxy_connect_timeout 30s;
        proxy_read_timeout    600s;
        proxy_send_timeout    600s;
    }
}

# ---- Public media hosts — ONLY when PEERTUBE_OBJECT_STORAGE_ENABLED=true ------
#
# PeerTube is the one app that needs TWO media hosts: web videos and HLS
# streaming playlists live in SEPARATE buckets, and each media domain maps to
# exactly one bucket. Both proxy Garage's WEB endpoint (:3902) and rewrite Host
# to the bucket vhost — NOT the S3 API (:3900, signed-only, 403s anonymous GETs).
# Why 3902-not-3900: see "Serving media to the public" in the repo README.
#
# Uncomment, replace the cert paths + the Garage MagicDNS host
# (GARAGE_MAGIC_NAME.TS_TAILNET), then in .env set:
#   PEERTUBE_OBJECT_STORAGE_WEB_VIDEOS_BASE_URL=https://video-peertube.example.com
#   PEERTUBE_OBJECT_STORAGE_STREAMING_PLAYLISTS_BASE_URL=https://playlist-peertube.example.com
#
# CORS: PeerTube's player fetches manifests + fmp4 segments cross-origin (MSE),
# so the buckets need an Access-Control-Allow-Origin rule. That is set on the
# bucket by `provision-garage` (S3 PutBucketCors) and served by Garage — do NOT
# strip it here. Plain <video src> media (Mastodon/Pixelfed/GTS) needs no CORS.
#
