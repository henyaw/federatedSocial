# GoToSocial — single binary, no separate workers or streaming tier.
#
# Bring up shared-db/ first. On a fresh pg-data volume the initdb script
# creates the gotosocial user/database automatically. On an existing
# volume, run the manual bootstrap command from the repo README.
#
# GoToSocial has no Redis dependency.

name: federated-gotosocial

services:

  ts-gotosocial-web:
    image: tailscale/tailscale:latest
    hostname: ${GOTOSOCIAL_WEB_MAGIC_NAME}
    environment:
      TS_AUTHKEY: ${TS_OAUTH_CLIENT_SECRET}?ephemeral=true
      TS_EXTRA_ARGS: --advertise-tags=tag:gotosocial-web
      TS_HOSTNAME: ${GOTOSOCIAL_WEB_MAGIC_NAME}
      TS_ACCEPT_DNS: "true"
      TS_AUTH_ONCE: "true"
      TS_USERSPACE: "false"
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: "127.0.0.1:9002"
    dns: [1.1.1.1, 1.0.0.1]
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9002/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  gotosocial:
    image: docker.io/superseriousbusiness/gotosocial:latest
    network_mode: "service:ts-gotosocial-web"
    environment:
      GTS_HOST: ${GOTOSOCIAL_URL}
      GTS_DB_TYPE: postgres
      # GTS_DB_ADDRESS must be written inline. Docker Compose does not expand
      # variables inside other variables, so ${DB_MAGIC_NAME}.${TS_TAILNET}
      # cannot live inside an intermediate var like GOTOSOCIAL_DB_HOST.
      GTS_DB_ADDRESS: ${DB_MAGIC_NAME}.${TS_TAILNET}
      GTS_DB_PORT: "5432"
      GTS_DB_NAME: ${GOTOSOCIAL_DB_NAME}
      GTS_DB_USER: ${GOTOSOCIAL_DB_USER}
      GTS_DB_PASSWORD: ${GOTOSOCIAL_DB_PASSWORD}
      GTS_LETSENCRYPT_ENABLED: "false"
      GTS_WAZERO_COMPILATION_CACHE: /gotosocial/.cache
      GTS_TRUSTED_PROXIES: ${GOTOSOCIAL_PROXY}
      # SMTP host/port/user/password come from the shared SMTP_* relay in .env;
      # only the sender address and display name are GTS-specific. GTS disables
      # email automatically when GTS_SMTP_HOST is empty.
      GTS_SMTP_HOST: ${SMTP_HOST}
      GTS_SMTP_PORT: ${SMTP_PORT}
      GTS_SMTP_USER: ${SMTP_USER}
      GTS_SMTP_PASSWORD: ${SMTP_PASSWORD}
      GTS_SMTP_FROM: ${GOTOSOCIAL_SMTP_FROM}
      GTS_SMTP_DISPLAY_NAME: ${SMTP_FROM_NAME}
      GTS_CONFIG_PATH: /gotosocial/config.yaml
    volumes:
      - gotosocial-wazero-cache:/gotosocial/.cache
      - ./gotosocial/config.yaml:/gotosocial/config.yaml
      - gotosocialuploads:/gotosocial/storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    depends_on:
      ts-gotosocial-web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  gotosocialuploads:
  gotosocial-wazero-cache:
