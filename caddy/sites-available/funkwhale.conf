# Reference Funkwhale reverse-proxy snippet for Caddy.
#
# Caddy handles TLS automatically (Let's Encrypt) and adds
# X-Forwarded-For / X-Forwarded-Proto / X-Forwarded-Host by default.
#
# Replace the domain and the MagicDNS hostname (FUNKWHALE_WEB_MAGIC_NAME
# + TS_TAILNET from your .env).

your-funkwhale-domain.example.com {
    # Funkwhale allows audio uploads up to NGINX_MAX_BODY_SIZE (default 100M).
    # Raise both here and in the compose env if you increase the limit.
    request_body {
        max_size 100MB
    }

    reverse_proxy http://YOUR-FUNKWHALE-WEB-MAGIC-NAME.YOUR-TS-TAILNET:80 {
        # Long timeouts for large audio file uploads and ActivityPub federation.
        transport http {
            dial_timeout          30s
            response_header_timeout 300s
        }
        # Disable response buffering for SSE / ActivityPub keep-alive streams.
        flush_interval -1
    }
}
