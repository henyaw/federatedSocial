# Stalwart Mail Server — sidecar pattern, no host port bindings.
#
# The sidecar (ts-stalwart) joins the tailnet tagged tag:stalwart and gives
# Stalwart its only network interface. Mail ports (25/465/587/143/993) are
# exposed to the internet by the L4 edge caddy in stalwart/caddy/ — NOT here.
# Only JMAP/admin (8080) needs to be reachable from inside the tailnet (to
# the reverse proxy box).
#
# FIRST BOOT:
#   1. ./bootstrap.sh provision-db stalwart   # creates user/db in postgres
#   2. ./bootstrap.sh up stalwart             # generates config.runtime.json, brings up stack
#   3. Log into Stalwart admin UI → configure ACME (DNS-01), SMTP, etc.
#
# The bootstrap config (config.runtime.json) only tells Stalwart where its
# Postgres database is. Everything else (TLS, ACME, SMTP, S3 blobs) is stored
# in Postgres and managed via the admin UI.
#
# PROXY PROTOCOL: the L4 edge sends PROXY protocol v2 on mail ports. Stalwart
# must trust 100.64.0.0/10 (Tailscale CGNAT) on those listeners. Configure
# this in the admin UI after first boot — do NOT set it globally or the admin
# port will also expect PROXY protocol headers and break.

name: federated-stalwart

services:

  ts-stalwart:
    image: tailscale/tailscale:latest
    hostname: ${STALWART_MAGIC_NAME}
    environment:
      TS_AUTHKEY: ${TS_OAUTH_CLIENT_SECRET}?ephemeral=true
      TS_EXTRA_ARGS: --advertise-tags=tag:stalwart
      TS_HOSTNAME: ${STALWART_MAGIC_NAME}
      TS_ACCEPT_DNS: "true"
      TS_AUTH_ONCE: "true"
      TS_USERSPACE: "false"
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: "127.0.0.1:9002"
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    healthcheck:
      # Gate on postgres AND garage — Stalwart's admin web SPA is stored in
      # S3 (Garage). If Garage isn't reachable on first boot, the UI blob
      # write fails silently and the admin site never loads. This is the exact
      # failure mode that motivated the nc-check pattern (see LESSONS.md).
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9002/healthz && nc -z -w3 ${DB_MAGIC_NAME}.${TS_TAILNET} 5432 && nc -z -w3 ${GARAGE_MAGIC_NAME}.${TS_TAILNET} 3900"]
      interval: 10s
      timeout: 15s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  stalwart:
    image: stalwartlabs/stalwart:latest
    network_mode: "service:ts-stalwart"
    environment:
      # Bootstrap config: where to find the Postgres datastore. All other
      # configuration (TLS, ACME, SMTP, S3, PROXY protocol trust) lives in
      # Postgres and is managed through the admin UI.
      STALWART_DB_PASSWORD: ${STALWART_DB_PASSWORD}
      # Fallback admin credentials (used only if the DB is empty / unbootstrapped).
      STALWART_FALLBACK_ADMIN_SECRET: ${STALWART_FALLBACK_ADMIN_SECRET}
      # S3 (Garage) for blob storage (mail objects, admin web SPA).
      AWS_ACCESS_KEY_ID: ${GARAGE_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${GARAGE_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${GARAGE_REGION}
    volumes:
      # The runtime config is generated by `./bootstrap.sh up stalwart` from
      # the template in config/config.json. It is gitignored.
      - ./config/config.runtime.json:/etc/stalwart/config.json:ro
      - stalwart-data:/opt/stalwart
    depends_on:
      ts-stalwart:
        condition: service_healthy
    restart: unless-stopped

volumes:
  stalwart-data:
